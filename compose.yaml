services:
  cabinet:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - alfa_credit_data:/app/data
    restart: unless-stopped
    init: true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=3).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  alfa_credit_data:
