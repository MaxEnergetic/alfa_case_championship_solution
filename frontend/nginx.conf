server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 11m;

    location /api/ {
        proxy_pass http://applications:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 100s;
    }
    location = /health { proxy_pass http://applications:8000/health; }
    location /docs { proxy_pass http://applications:8000/docs; }
    location = /openapi.json { proxy_pass http://applications:8000/openapi.json; }
    location / {
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'" always;
        try_files $uri /index.html;
    }
}
